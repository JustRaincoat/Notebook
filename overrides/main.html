{% extends "base.html" %}

{% block announce %}
<div style="font-size: .72rem; display: flex; gap: .5rem; align-items: center;">
  <span>⚠️ 公式 / 图表渲染异常时，请按</span>
  <kbd style="padding: 0 .3rem; border: 1px solid currentColor; border-radius: .2rem;">Ctrl</kbd>
  <span>+</span>
  <kbd style="padding: 0 .3rem; border: 1px solid currentColor; border-radius: .2rem;">F5</kbd>
  <span>强制刷新（浏览器缓存可能导致渲染失效）</span>
</div>
{% endblock %}
